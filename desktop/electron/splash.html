<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'" />
    <meta name="color-scheme" content="light" />
    <title>Starting MyCrobo</title>
    <style>
      :root { color: #293a43; background: #f8f8f5; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 30%, #fff 0, #f8f8f5 66%, #eef2f3 100%); }
      main { width: 100%; display: grid; justify-items: center; gap: 25px; padding: 38px; text-align: center; }
      img { display: block; width: min(300px, 76vw); height: 100px; object-fit: contain; }
      p { margin: 0; color: #6c7f88; font-size: 13px; letter-spacing: .01em; }
      .progress { width: 180px; height: 3px; overflow: hidden; border-radius: 999px; background: #dce4e7; }
      .progress::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #293a43, #89a0a8); animation: loading 1.3s ease-in-out infinite alternate; }
      @keyframes loading { from { transform: translateX(-15%); } to { transform: translateX(135%); } }
      @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <img src="../../apps/client/assets/mycrobo-lockup-v1.png" alt="MyCrobo" />
      <div class="progress" role="progressbar" aria-label="Starting MyCrobo"></div>
      <p>Preparing your private workspace…</p>
    </main>
  </body>
</html>
